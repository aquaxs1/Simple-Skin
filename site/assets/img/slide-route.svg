<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" role="img">
<style>
  text { font-family: ui-monospace,'SF Mono',Menlo,Consolas,monospace; }
  .t { fill: #E8E2D3; }
  .m { fill: #B4AEA1; }
  @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
  @keyframes drift { 0% { transform: translateY(0) } 50% { transform: translateY(-6px) } 100% { transform: translateY(0) } }
  @keyframes dash { to { stroke-dashoffset: -28 } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  .flow{stroke-dasharray:7 7;animation:dash 1s linear infinite}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1410"/><stop offset="1" stop-color="#070a08"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7ED957" stop-opacity=".22"/><stop offset="1" stop-color="#7ED957" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="1240" height="720" fill="url(#bg)"/>
<rect width="1240" height="260" fill="url(#glow)"/>
<text x="620.0" y="74" font-size="26" text-anchor="middle" font-weight="700" class="t">ANY SERVER</text>
<text x="620.0" y="106" font-size="15" text-anchor="middle" font-weight="400" class="m">Vanilla server? The skin still reaches everyone — the long way round</text>
<rect x="76" y="176" width="348" height="300" fill="#D98555" rx="14" opacity=".08"/>
<rect x="80" y="180" width="340" height="292" fill="#171B20" rx="12" stroke="#D98555" stroke-width="2"/>
<circle cx="124" cy="230" r="24" fill="#D98555" opacity=".16"/>
<text x="124" y="238" font-size="22" text-anchor="middle" font-weight="700" class="t" fill="#D98555">1</text>
<text x="162" y="238" font-size="19" text-anchor="start" font-weight="700" class="t">Upload</text>
<text x="106" y="290" font-size="12.5" text-anchor="start" font-weight="400" class="m">The PNG is pushed to your</text>
<text x="106" y="314" font-size="12.5" text-anchor="start" font-weight="400" class="m">authenticated Minecraft profile.</text>
<path d="M428 326 H 449" stroke="#D98555" stroke-width="3" fill="none" class="flow"/>
<polygon points="453,326 441,320 441,332" fill="#D98555"/>
<rect x="449" y="176" width="348" height="300" fill="#7FB4E8" rx="14" opacity=".08"/>
<rect x="453" y="180" width="340" height="292" fill="#171B20" rx="12" stroke="#7FB4E8" stroke-width="2"/>
<circle cx="497" cy="230" r="24" fill="#7FB4E8" opacity=".16"/>
<text x="497" y="238" font-size="22" text-anchor="middle" font-weight="700" class="t" fill="#7FB4E8">2</text>
<text x="535" y="238" font-size="19" text-anchor="start" font-weight="700" class="t">Verify</text>
<text x="479" y="290" font-size="12.5" text-anchor="start" font-weight="400" class="m">Simple Skin downloads what Mojang</text>
<text x="479" y="314" font-size="12.5" text-anchor="start" font-weight="400" class="m">really serves and compares it byte</text>
<text x="479" y="338" font-size="12.5" text-anchor="start" font-weight="400" class="m">for byte — the CDN lags behind.</text>
<path d="M801 326 H 822" stroke="#7FB4E8" stroke-width="3" fill="none" class="flow"/>
<polygon points="826,326 814,320 814,332" fill="#7FB4E8"/>
<rect x="822" y="176" width="348" height="300" fill="#83C65A" rx="14" opacity=".08"/>
<rect x="826" y="180" width="340" height="292" fill="#171B20" rx="12" stroke="#83C65A" stroke-width="2"/>
<circle cx="870" cy="230" r="24" fill="#83C65A" opacity=".16"/>
<text x="870" y="238" font-size="22" text-anchor="middle" font-weight="700" class="t" fill="#83C65A">3</text>
<text x="908" y="238" font-size="19" text-anchor="start" font-weight="700" class="t">Rejoin</text>
<text x="852" y="290" font-size="12.5" text-anchor="start" font-weight="400" class="m">Reconnecting makes the server</text>
<text x="852" y="314" font-size="12.5" text-anchor="start" font-weight="400" class="m">re-read your profile and send it</text>
<text x="852" y="338" font-size="12.5" text-anchor="start" font-weight="400" class="m">to every player online.</text>
<rect x="80" y="528" width="1080" height="128" fill="#171B20" rx="10" stroke="#3A4148" stroke-width="1"/>
<text x="108" y="566" font-size="14" text-anchor="start" font-weight="700" class="t">Why the detour?</text>
<text x="108" y="596" font-size="12.5" text-anchor="start" font-weight="400" class="m">Every other player's game asks the server what your skin is, and the server asks Mojang</text>
<text x="108" y="620" font-size="12.5" text-anchor="start" font-weight="400" class="m">exactly once — while you are logging in. Rejoining is the only client-side way to redo that.</text>
</svg>
