org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Minecraft 26.2 ships unobfuscated, so there are no yarn or official mappings for it
# (Mojang stopped publishing client_mappings with 26.1). The build therefore uses Fabric's
# no-remap Loom, which compiles straight against the shipped names.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.14.0-alpha.31
fabric_version=0.158.0+26.2

mod_version=2.0.0
maven_group=de.simpleskin
archives_base_name=simple-skin
