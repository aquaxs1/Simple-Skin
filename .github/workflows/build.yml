name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      # Loom leaves sources and dev jars in build/libs; only the mod jar is what
      # people drop into their mods folder.
      - name: Collect the mod jar
        run: |
          mkdir -p dist
          find build/libs -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' \
            -exec cp {} dist/ \;
          ls -l dist
          ( cd dist && sha256sum *.jar > SHA256SUMS.txt && cat SHA256SUMS.txt )

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: simple-skin
          path: dist/
          if-no-files-found: error

  # Independent of the build so that a v* tag always produces a release, even if
  # the build failed here — the jar can then be attached by hand.
  release:
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download the built jar
        id: artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: simple-skin
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -d dist ] && [ -n "$(ls -A dist 2>/dev/null)" ]; then
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
            echo "No jar was built - attach it to the release manually." >> "$GITHUB_STEP_SUMMARY"
          fi
