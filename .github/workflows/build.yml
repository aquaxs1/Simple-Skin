name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Actions -> Build -> "Run workflow". Leave the version empty for a plain
  # build; fill it in (for example 2.0.0) to also publish that release, which
  # creates the v2.0.0 tag on the commit the run was started from.
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to release, for example 2.0.0 (empty = build only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      # Loom leaves sources and dev jars in build/libs; only the mod jar is what
      # people drop into their mods folder.
      - name: Collect the mod jar
        run: |
          mkdir -p dist
          find build/libs -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' \
            -exec cp {} dist/ \;
          ls -l dist
          ( cd dist && sha256sum *.jar > SHA256SUMS.txt && cat SHA256SUMS.txt )

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: simple-skin
          path: dist/
          if-no-files-found: error

  # Independent of the build so that a v* tag (or a manual run with a version)
  # always produces a release, even if the build failed here — the jar can then
  # be attached by hand.
  release:
    needs: build
    if: always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != ''))
    runs-on: ubuntu-latest
    steps:
      - name: Download the built jar
        id: artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: simple-skin
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_version && format('v{0}', inputs.release_version) || github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$TAG' is not a version tag like v2.0.0"; exit 1 ;;
          esac
          if [ -d dist ] && [ -n "$(ls -A dist 2>/dev/null)" ]; then
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" --generate-notes
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" --generate-notes
            echo "No jar was built - attach it to the release manually." >> "$GITHUB_STEP_SUMMARY"
          fi
